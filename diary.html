<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'"><title>하루의 조각 · 일기장</title><link rel="stylesheet" href="diary.css"><link rel="icon" href="icon.svg"></head><body>
<header><a href="/">← 교실 도구함</a><span>LOCAL DIARY · 나만의 기록</span></header><main><div class="hero"><p class="eyebrow">A LITTLE MOMENT, KEPT.</p><h1>하루의 조각<span>오늘의 나를, 남겨요.</span></h1><p>지나간 하루가 소중한 이야기가 되도록.</p></div>
<div class="workspace"><aside><div class="list-heading"><h2>모아둔 날들 <small id="count">0</small></h2><button id="new" type="button">＋ 새 일기</button></div><label class="search">기록 검색<input id="search" type="search" placeholder="제목이나 내용으로 찾아보세요"></label><div id="entries"></div></aside>
<section class="editor"><form id="form"><div class="meta"><label>날짜<input id="date" type="date" required></label><label>오늘의 기분<select id="mood"><option>좋음</option><option>평온</option><option>보통</option><option>지침</option><option>속상</option></select></label></div><label class="title-label">오늘의 제목<input id="title" maxlength="120" placeholder="어떤 하루였나요?" required></label><label>하루의 이야기<textarea id="content" maxlength="100000" placeholder="오늘 기억하고 싶은 순간을 자유롭게 적어보세요." required></textarea></label><div class="actions"><span id="length">0자</span><button id="delete" type="button" hidden>삭제</button><button id="save" class="primary" type="submit">일기 저장</button></div></form><p id="status" role="status" aria-live="polite"></p><p class="storage">이 컴퓨터의 data/diary.sqlite에 저장됩니다.<br>저장 버튼을 눌러 기록을 보관하세요.</p></section></div></main><footer>작은 순간도, 당신의 이야기니까.</footer><script type="module" src="diary.js"></script></body></html>
