<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://apis.google.com; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com; frame-src 'self' https://classroom-diary-jaden80.firebaseapp.com; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'"><title>하루의 조각 · 일기장</title><link rel="stylesheet" href="diary.css"><link rel="icon" href="icon.svg"></head><body>
<header><a href="https://jaden80.github.io/classroom-toolbox/">← 교실 도구함</a><span>PRIVATE DIARY · 나만의 기록</span></header><main><div class="hero"><p class="eyebrow">A LITTLE MOMENT, KEPT.</p><h1>하루의 조각<span>오늘의 나를, 남겨요.</span></h1><p>지나간 하루가 소중한 이야기가 되도록.</p></div>
<section id="auth-panel" class="auth-panel"><p id="auth-user">Google 계정으로 로그인하면 나만의 일기를 이어서 볼 수 있어요.</p><button id="google-login" type="button" class="primary">Google로 로그인</button><button id="logout" type="button" hidden>로그아웃</button><p id="auth-status" role="status"></p></section><div class="workspace" id="workspace" hidden><aside><div class="list-heading"><h2>모아둔 날들 <small id="count">0</small></h2><button id="new" type="button">＋ 새 일기</button></div><label class="search">기록 검색<input id="search" type="search" placeholder="제목이나 내용으로 찾아보세요"></label><div id="entries"></div></aside>
<section class="editor"><form id="form"><div class="meta"><label>날짜<input id="date" type="date" required></label><label>오늘의 기분<select id="mood"><option>좋음</option><option>평온</option><option>보통</option><option>지침</option><option>속상</option></select></label></div><label class="title-label">오늘의 제목<input id="title" maxlength="120" placeholder="어떤 하루였나요?" required></label><label>하루의 이야기<textarea id="content" maxlength="100000" placeholder="오늘 기억하고 싶은 순간을 자유롭게 적어보세요." required></textarea></label><div class="actions"><span id="length">0자</span><button id="delete" type="button" hidden>삭제</button><button id="save" class="primary" type="submit">일기 저장</button></div></form><p id="status" role="status" aria-live="polite"></p><p class="storage">로그인한 계정의 비공개 저장 공간에 보관됩니다.<br>공용 기기에서는 사용 후 로그아웃하세요. 일기 내용은 기기에 영구 저장하지 않습니다. 목록·검색은 최근 일기 200개를 대상으로 합니다.</p></section></div></main><footer>작은 순간도, 당신의 이야기니까.</footer><script type="module" src="diary.js"></script></body></html>
